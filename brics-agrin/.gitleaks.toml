# Gitleaks configuration for BRICS AgriN
# Scans for accidentally committed secrets

title = "BRICS AgriN Secret Scanner"

[extend]
useDefault = true

[[rules]]
id = "jwt-secret"
description = "Possible JWT secret"
regex = '''JWT_(ACCESS|REFRESH)_SECRET\s*=\s*["']?[A-Za-z0-9_\-\.]{32,}["']?'''
tags = ["jwt", "secret"]

[[rules]]
id = "openai-key"
description = "OpenAI API key"
regex = '''sk-[A-Za-z0-9]{20,}'''
tags = ["openai", "api-key"]

[[rules]]
id = "database-url-with-password"
description = "Database URL containing password"
regex = '''postgresql://[^:]+:[^@]{8,}@'''
tags = ["database", "credentials"]

# Allow these patterns in .env.example (placeholders only)
[[allowlist]]
description = "Allow placeholder values in .env.example"
paths = ['''\.env\.example$''']
regexes = ['''CHANGE_ME''', '''your_.*_here''']
